name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prime
          POSTGRES_PASSWORD: prime
          POSTGRES_DB: prime_coffee_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U prime"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      TEST_DATABASE_URL: postgres://prime:prime@localhost:5432/prime_coffee_test
      MONGO_TEST_URL: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
